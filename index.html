<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ふくちゃんトーク</title>
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:        #e8b4b8;
      --pink-light:  #f5dde0;
      --pink-pale:   #fdf0f1;
      --cream:       #fdf6ec;
      --cream-dark:  #f5ead8;
      --brown:       #8b5e3c;
      --brown-light: #c49a6c;
      --brown-dark:  #5c3d2e;
      --text:        #4a3728;
      --text-light:  #9e7d65;
      --white:       #ffffff;
      --shadow:      rgba(139, 94, 60, 0.12);
    }

    html, body {
      height: 100%;
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== レイアウト ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--cream);
      position: relative;
    }

    /* ===== ヘッダー ===== */
    header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--pink) 0%, var(--brown-light) 100%);
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px var(--shadow);
      position: relative;
      z-index: 10;
    }

    .header-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 2px 6px var(--shadow);
      flex-shrink: 0;
    }

    .header-info { flex: 1; }

    .header-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
      line-height: 1.2;
      text-shadow: 0 1px 3px rgba(92,61,46,0.3);
    }

    .header-status {
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      margin-top: 1px;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a8e6a3;
      margin-right: 4px;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== チャットエリア ===== */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 2px; }

    /* ===== メッセージ ===== */
    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeInUp 0.25s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--cream-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .msg-body { max-width: 75%; display: flex; flex-direction: column; gap: 3px; }

    .message.user .msg-body { align-items: flex-end; }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* ふく側 */
    .message.bot .msg-bubble {
      background: var(--white);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    /* ユーザー側 */
    .message.user .msg-bubble {
      background: linear-gradient(135deg, var(--pink) 0%, var(--brown-light) 100%);
      color: var(--white);
      border-bottom-right-radius: 4px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-light);
      padding: 0 4px;
    }

    /* ===== 読み込み中（ドット） ===== */
    .typing-bubble {
      background: var(--white);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      box-shadow: 0 1px 4px var(--shadow);
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ===== ウェルカムカード ===== */
    .welcome-card {
      background: var(--white);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 2px 8px var(--shadow);
      border: 1.5px solid var(--pink-light);
    }

    .welcome-owl { font-size: 48px; margin-bottom: 8px; }

    .welcome-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 6px;
    }

    .welcome-desc {
      font-size: 13px;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
    }

    .quick-btn {
      background: var(--pink-pale);
      border: 1.5px solid var(--pink);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--brown);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .quick-btn:hover, .quick-btn:active {
      background: var(--pink-light);
      transform: scale(0.97);
    }

    /* ===== 入力エリア ===== */
    #input-area {
      flex-shrink: 0;
      background: var(--white);
      border-top: 1.5px solid var(--pink-light);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      align-items: flex-end;
      box-shadow: 0 -2px 8px var(--shadow);
    }

    #msg-input {
      flex: 1;
      background: var(--cream);
      border: 1.5px solid var(--cream-dark);
      border-radius: 22px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      resize: none;
      max-height: 100px;
      min-height: 42px;
      overflow-y: auto;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s;
    }

    #msg-input:focus {
      border-color: var(--pink);
      background: var(--white);
    }

    #msg-input::placeholder { color: var(--text-light); }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink) 0%, var(--brown-light) 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 2px 6px var(--shadow);
    }

    #send-btn:hover { transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 18px; height: 18px; fill: var(--white); }

    /* ===== エラーバナー ===== */
    .error-msg {
      background: #fdecea;
      border: 1px solid #f5c6c3;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #c0392b;
      text-align: center;
    }

    /* ===== PIN画面 ===== */
    #pin-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, var(--pink-pale) 0%, var(--cream) 60%, var(--cream-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    #pin-screen.hidden { display: none; }

    .pin-card {
      background: var(--white);
      border-radius: 24px;
      padding: 36px 28px 32px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(139,94,60,0.18);
      border: 1.5px solid var(--pink-light);
    }

    .pin-owl {
      font-size: 56px;
      margin-bottom: 4px;
      animation: owlBob 3s ease-in-out infinite;
    }

    @keyframes owlBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pin-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 4px;
    }

    .pin-subtitle {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 24px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--pink);
      background: transparent;
      transition: all 0.15s;
    }

    .pin-dot.filled {
      background: var(--pink);
      border-color: var(--brown-light);
      transform: scale(1.15);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .pin-key {
      height: 58px;
      border-radius: 14px;
      border: 1.5px solid var(--cream-dark);
      background: var(--cream);
      font-size: 22px;
      font-weight: 600;
      color: var(--brown-dark);
      cursor: pointer;
      transition: all 0.12s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-key:hover { background: var(--pink-pale); border-color: var(--pink); }
    .pin-key:active { transform: scale(0.93); background: var(--pink-light); }
    .pin-key.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
    .pin-key.delete { font-size: 18px; color: var(--text-light); }

    .pin-msg {
      font-size: 13px;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    .pin-msg.error { color: #c0392b; }
    .pin-msg.lock  { color: var(--brown-light); }

    .pin-card.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }

    /* ===== デスクトップ対応 ===== */
    @media (min-width: 481px) {
      body { background: var(--pink-pale); }
      #app {
        margin: 20px auto;
        height: calc(100dvh - 40px);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(139,94,60,0.2);
      }
    }
  </style>
</head>
<body>
<!-- ===== PIN認証画面 ===== -->
<div id="pin-screen">
  <div class="pin-card" id="pin-card">
    <div class="pin-owl">🦉</div>
    <div class="pin-title">ふくちゃんトーク</div>
    <div class="pin-subtitle">PINを入力してね</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-keypad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key delete" onclick="pinDelete()">⌫</button>
    </div>
    <div class="pin-msg" id="pin-msg"></div>
  </div>
</div>

<div id="app">

  <header>
    <div class="header-avatar">🦉</div>
    <div class="header-info">
      <div class="header-name">ふくちゃんトーク</div>
      <div class="header-status">
        <span class="status-dot"></span>ふく、いつでもいるよ〜
      </div>
    </div>
  </header>

  <div id="chat-area">
    <div class="welcome-card">
      <div class="welcome-owl">🦉</div>
      <div class="welcome-title">ふく、きたよ〜！</div>
      <div class="welcome-desc">
        家族の秘書フクロウ「ふく」だよ📋<br>
        記念日・契約・家計のこと、なんでも聞いてね。
      </div>
      <div class="quick-btns">
        <button class="quick-btn" onclick="quickSend('今月の家計を教えて')">💰 今月の家計</button>
        <button class="quick-btn" onclick="quickSend('保険の情報を教えて')">📄 保険の情報</button>
        <button class="quick-btn" onclick="quickSend('近い誕生日はある？')">🎂 近い誕生日</button>
        <button class="quick-btn" onclick="quickSend('インターネットの契約を教えて')">📡 ネット契約</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <textarea
      id="msg-input"
      placeholder="ふくに聞いてみて…"
      rows="1"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()" title="送信">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script>
  /* ===== PIN認証 ===== */
  const CORRECT_PIN = '1122';
  const MAX_FAILS   = 3;
  const LOCK_SEC    = 30;

  let pinInput   = '';
  let failCount  = 0;
  let lockTimer  = null;

  function pinKey(digit) {
    if (lockTimer || pinInput.length >= 4) return;
    pinInput += digit;
    updateDots();
    if (pinInput.length === 4) setTimeout(checkPin, 120);
  }

  function pinDelete() {
    if (lockTimer) return;
    pinInput = pinInput.slice(0, -1);
    updateDots();
    setMsg('', '');
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      document.getElementById('d' + i).classList.toggle('filled', i < pinInput.length);
    }
  }

  function setMsg(text, type) {
    const el = document.getElementById('pin-msg');
    el.textContent = text;
    el.className = 'pin-msg' + (type ? ' ' + type : '');
  }

  function checkPin() {
    if (pinInput === CORRECT_PIN) {
      document.getElementById('pin-screen').classList.add('hidden');
      if (window.innerWidth >= 481) msgInput.focus();
      return;
    }
    failCount++;
    pinInput = '';
    updateDots();

    const card = document.getElementById('pin-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');

    if (failCount >= MAX_FAILS) {
      startLock();
    } else {
      setMsg('ふく、それちがうみたい…🦉', 'error');
    }
  }

  function startLock() {
    let remaining = LOCK_SEC;
    setMsg(`${remaining}秒ロック中だよ…ちょっとねむいだけ…🦉`, 'lock');
    document.querySelectorAll('.pin-key').forEach(k => k.disabled = true);

    lockTimer = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(lockTimer);
        lockTimer = null;
        failCount = 0;
        document.querySelectorAll('.pin-key').forEach(k => k.disabled = false);
        setMsg('もう一度入力してね🦉', '');
      } else {
        setMsg(`${remaining}秒ロック中だよ…ちょっとねむいだけ…🦉`, 'lock');
      }
    }, 1000);
  }

  /* ===== チャット ===== */
  const API_URL = 'https://fukuchan-backend-1025423451531.asia-northeast1.run.app';
  const chatArea = document.getElementById('chat-area');
  const msgInput = document.getElementById('msg-input');
  const sendBtn  = document.getElementById('send-btn');

  // Gemini API形式: role は "user" | "model"
  let conversationHistory = [];

  /* ===== ユーティリティ ===== */
  function now() {
    return new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom() {
    chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
  }

  function setLoading(flag) {
    sendBtn.disabled = flag;
    msgInput.disabled = flag;
  }

  /* ===== メッセージ追加 ===== */
  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `message ${role === 'user' ? 'user' : 'bot'}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '👤' : '🦉';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();

    body.appendChild(bubble);
    body.appendChild(time);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    chatArea.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message bot';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🦉';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('div');
      dot.className = 'typing-dot';
      bubble.appendChild(dot);
    }

    body.appendChild(bubble);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    chatArea.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function addError(msg) {
    const el = document.createElement('div');
    el.className = 'error-msg';
    el.textContent = msg;
    chatArea.appendChild(el);
    scrollToBottom();
  }

  /* ===== 送信処理 ===== */
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || sendBtn.disabled) return;

    msgInput.value = '';
    msgInput.style.height = 'auto';

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    const typing = addTyping();
    setLoading(true);

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: conversationHistory.slice(0, -1) // 最新の発言を除いた履歴
        })
      });

      typing.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `エラー ${res.status}`);
      }

      const data = await res.json();
      const reply = data.reply || '（返答がなかったよ…）';

      addMessage('model', reply);
      conversationHistory.push({ role: 'model', content: reply });

      // 履歴が長くなりすぎないよう直近20ターンに絞る
      if (conversationHistory.length > 40) {
        conversationHistory = conversationHistory.slice(-40);
      }
    } catch (e) {
      typing.remove();
      addError(`ふく、ちょっとエラーが…「${e.message}」`);
    } finally {
      setLoading(false);
      msgInput.focus();
    }
  }

  function quickSend(text) {
    msgInput.value = text;
    sendMessage();
  }

  /* ===== テキストエリア自動リサイズ ===== */
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
  });

  /* ===== Enter送信（Shift+Enterで改行） ===== */
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ===== 初期フォーカス（デスクトップ） ===== */
  if (window.innerWidth >= 481) msgInput.focus();
</script>
</body>
</html>
