name = "fukuchan-app"
main = "src/index.js"
compatibility_date = "2026-09-05"

# ふくちゃんトーク：静的ファイル配信 + /auth・/chat・/health API を1つのWorkerに統合
# design.md の ADR（0章）参照

[vars]
GITHUB_REPO = "fukurose-jun02/fukuchan-knowledge"
# finance Worker本番デプロイ済み。Gemini function callingで家計MCPを有効化する。
FINANCE_TOOL_ENABLED = "true"

# デプロイ時に、本番Workerへ必要なSecretsがすべて設定済みか検証する。
# 値はCloudflare Workers Secretsで管理し、このファイルやGitHubには保存しない。
[secrets]
required = ["GEMINI_API_KEY", "GITHUB_TOKEN", "WORKER_PIN", "AUTH_TOKEN_SECRET"]

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
binding = "ASSETS"
# 静的ファイルにマッチしないパスは元々Workerへフォールバックするが、
# API側の3経路は明示的に必ずWorkerを通す（design.md 3章）
run_worker_first = ["/auth", "/chat", "/health"]

# フェーズ3：finance Workerへの内部RPC。公開MCP URLやOAuthは経由しない。
[[services]]
binding = "FINANCE_SERVICE"
service = "fukuchan-finance-mcp"
entrypoint = "FinanceMcpApi"

# PIN総当たり対策（design.md 5章・6-2）。period は 10 か 60 のみ設定可能。
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 20
period = 60

# 上記4項目の値はシークレットのため wrangler.toml には書かない
# （ローカルは .dev.vars、本番はCloudflare Workers Secretsで管理）
