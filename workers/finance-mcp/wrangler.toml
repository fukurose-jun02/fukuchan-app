name = "fukuchan-finance-mcp"
main = "src/index.js"
compatibility_date = "2026-09-05"

[vars]
# GitHub OAuthでログインを許可するユーザー。複数はカンマ区切り。
GITHUB_ALLOWED_LOGIN = "fukurose-jun02"
# GitHub OAuth Appへ登録したcallback URL（本番WorkerのURLと完全一致させる）。
GITHUB_OAUTH_CALLBACK_URL = "https://fukuchan-finance-mcp.fukuchan-app.workers.dev/github/callback"
# 任意。ブラウザ型MCPクライアントのOriginをカンマ区切りで許可する。
# MCP_ALLOWED_ORIGINSは必要になった時点で本番環境のvarsへ追加する。

# Cloudflare上に作成した家計集計用のリモートD1。
[[d1_databases]]
binding = "FINANCE_DB"
database_name = "fukuchan-finance"
database_id = "bf9117c6-f321-4c39-b6fa-fe425e976ed4"

# Cloudflare上に作成したOAuth状態・grant・token保存用KV。
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "e06a48adc32841cc8da31110d5941df6"

[secrets]
required = ["GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET", "COOKIE_ENCRYPTION_KEY"]

[observability]
enabled = true
